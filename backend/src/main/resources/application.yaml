spring:
  application:
    name: 'mikroblog'
  datasource:
    #url: jdbc:hsqldb:hsql://localhost:9001/mikroblog # Server mode
    url: jdbc:hsqldb:file:./data/mikroblog-db   # file-based DB, persists between restarts
    # url: jdbc:hsqldb:mem:mikroblog # In-memory only (data lost on restart)

    driver-class-name: org.hsqldb.jdbc.JDBCDriver
    username: sa
    password: ""

  jpa:
#    database-platform: org.hibernate.dialect.HSQLDialect
    hibernate:
      ddl-auto: update        # or create-drop / validate / create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always           # runs schema.sql / data.sql if present